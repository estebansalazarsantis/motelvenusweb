<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 230 62" role="img" aria-labelledby="title desc">
  <title id="title">Motel Los Ángeles de Venus</title>
  <desc id="desc">Identidad gráfica inspirada en el letrero histórico del Motel Los Ángeles de Venus.</desc>
  <defs>
    <linearGradient id="venusGlow" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#60798c"/>
      <stop offset="1" stop-color="#283844"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="228" height="60" rx="11" fill="#161310" stroke="#c75b27" stroke-width="2"/>
  <rect x="1" y="1" width="6" height="60" rx="3" fill="#c75b27"/>
  <ellipse cx="163" cy="38" rx="56" ry="20" fill="url(#venusGlow)" opacity=".78"/>
  <text x="17" y="27" fill="#f6eee4" font-family="Arial Black, Arial, sans-serif" font-size="24" font-weight="900" letter-spacing="1.2">MOTEL</text>
  <text x="101" y="20" fill="#eadfd5" font-family="Georgia, Times New Roman, serif" font-size="10.5" font-style="italic">Los Ángeles de</text>
